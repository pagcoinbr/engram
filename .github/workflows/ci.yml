name: CI

# The repository had no CI at all. GitHub reporting a PR as MERGEABLE only means
# there is no textual conflict; it is not evidence that anything works. These are
# the checks that should be required before merge.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --locked: a CI run that silently updates Cargo.lock is not testing the
      # dependency set the branch actually ships.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  python:
    name: Python and shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suites load modules by path into a throwaway $HOME, so only PyYAML is
      # needed. Tests that want a live Neo4j/Qdrant/LLM skip themselves.
      - run: python -m pip install --quiet pyyaml
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - run: bash tests/run_all.sh --python

  portability:
    name: No host-specific defaults
    runs-on: ubuntu-latest
    # The check that would have caught the release blockers: hard-coded
    # /root/.claude paths and the "-root" memory slug were invisible on the host
    # this code was written on, where engram happens to run as root. Every path
    # must come from engram-paths, which derives from $HOME/$ENGRAM_* at runtime.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the shipped binaries
        run: cargo build --release --locked -p engram-app --bins
      - name: Assert no baked-in root paths or slugs
        run: |
          set -euo pipefail
          status=0
          for bin in target/release/engram-*; do
            [[ -f "$bin" && -x "$bin" ]] || continue
            if strings "$bin" | grep -qx '/root/.claude/engram.yaml'; then
              echo "::error file=$bin::carries a /root config default"; status=1
            fi
            if strings "$bin" | grep -qx -- '-root'; then
              echo "::error file=$bin::carries the -root memory slug default"; status=1
            fi
          done
          exit $status
      - name: Resolution follows the environment
        run: cargo test --locked -p engram-paths
