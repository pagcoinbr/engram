services:
  neo4j:
    image: neo4j:5.26-community
    container_name: memgraph-neo4j
    restart: unless-stopped
    # Bound to loopback only — the memory graph never listens on the LAN.
    ports:
      - "127.0.0.1:7474:7474"   # HTTP browser (local only)
      - "127.0.0.1:7687:7687"   # Bolt (local only)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
