[package]
name = "engram-hybrid"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
engram-config = { path = "../engram-config" }
engram-graph = { path = "../engram-graph" }
engram-models = { path = "../engram-models" }
engram-paths = { path = "../engram-paths" }
engram-retrieval = { path = "../engram-retrieval" }
engram-store = { path = "../engram-store" }
engram-vector = { path = "../engram-vector" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
