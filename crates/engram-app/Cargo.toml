[package]
name = "engram-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
engram-config = { path = "../engram-config" }
engram-graph = { path = "../engram-graph" }
engram-hybrid = { path = "../engram-hybrid" }
engram-models = { path = "../engram-models" }
engram-paths = { path = "../engram-paths" }
engram-retrieval = { path = "../engram-retrieval" }
engram-secrets = { path = "../engram-secrets" }
engram-store = { path = "../engram-store" }
engram-vector = { path = "../engram-vector" }
# For flock(2). Already in the dependency graph transitively; the config lock
# needs kernel-held advisory locking, which std does not expose.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
