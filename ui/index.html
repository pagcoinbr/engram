<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>engram</title>
<!-- Loopback-only dev UI. CDN libs are version-pinned; for a hardened/offline
     deploy, vendor these into ui/vendor/ (or add Subresource-Integrity hashes). -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.3"></script>
<style>
  body{background:#0b0f14;color:#cbd5e1}
  .card{background:#111722;border:1px solid #1f2a37;border-radius:.75rem}
  .chip{font-size:.7rem;padding:.05rem .5rem;border-radius:9999px}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#243244;border-radius:9px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;
const API = "";
const j = (p,o)=>fetch(API+p,o).then(r=>r.ok?r.json():r.text().then(t=>{throw new Error(t)}));
const TYPE_COLOR = {user:"bg-violet-900 text-violet-200",feedback:"bg-amber-900 text-amber-200",
  project:"bg-emerald-900 text-emerald-200",reference:"bg-sky-900 text-sky-200"};

function Chip({children,cls}){return <span className={"chip "+(cls||"bg-slate-700 text-slate-200")}>{children}</span>;}
function Dot({ok}){return <span className={"inline-block w-2.5 h-2.5 rounded-full "+(ok?"bg-emerald-400":"bg-rose-500")}/>;}

function Dashboard(){
  const [h,setH]=useState(null),[g,setG]=useState(null),[err,setErr]=useState(null);
  useEffect(()=>{j("/api/health").then(setH).catch(e=>setErr(e.message));
                 j("/api/graph/stats").then(setG).catch(()=>{});},[]);
  if(err)return <div className="text-rose-400">health error: {err}</div>;
  if(!h)return <div className="text-slate-500">loading…</div>;
  const last=h.daemon?Object.entries(h.daemon).map(([k,v])=>k+"="+new Date(v*1000).toLocaleString()).join("  ·  "):"—";
  return <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <Stat label="Backend" v={h.backend||"?"} sub={"tier "+(h.tier||"-")}/>
    <Stat label="Generate" v={<Dot ok={h.generate}/>} sub={h.generate?"reachable":"down"}/>
    <Stat label="Embeddings" v={<Dot ok={h.embed}/>} sub={h.embed?("dim "+(h.embed_dim||"?")):"down"}/>
    <Stat label="Neo4j" v={<Dot ok={h.neo4j}/>} sub={h.neo4j?"up":"down"}/>
    <Stat label="Memories" v={h.memories}/>
    {g&&<Stat label="Graph" v={g.episodes+" eps"} sub={g.entities+" entities · "+g.facts+" facts"}/>}
    <div className="card p-4 sm:col-span-2 lg:col-span-4"><div className="text-xs text-slate-500 mb-1">daemon last-run</div>
      <div className="text-sm">{last}</div>
      {h.detail&&<div className="text-xs text-amber-400 mt-2">{h.detail}</div>}</div>
  </div>;
}
function Stat({label,v,sub}){return <div className="card p-4"><div className="text-xs text-slate-500">{label}</div>
  <div className="text-2xl mt-1">{v}</div>{sub&&<div className="text-xs text-slate-500 mt-1">{sub}</div>}</div>;}

function Memories(){
  const [list,setList]=useState([]),[sel,setSel]=useState(null),[body,setBody]=useState(""),[q,setQ]=useState(""),[msg,setMsg]=useState("");
  const load=useCallback(()=>j("/api/memories").then(d=>setList(d.memories)),[]);
  useEffect(()=>{load();},[load]);
  const open=f=>j("/api/memories/"+f).then(d=>{setSel(f);setBody(d.content);setMsg("");});
  const save=()=>{const f=sel||prompt("filename (e.g. project_foo.md)");if(!f)return;
    j("/api/memories",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({filename:f,description:(body.match(/description:\s*(.+)/)||[])[1]||"",content:body})})
      .then(r=>{setMsg("saved ✓");setSel(f);load();}).catch(e=>setMsg("error: "+e.message));};
  const del=()=>{if(sel&&confirm("delete "+sel+"?"))j("/api/memories/"+sel,{method:"DELETE"}).then(()=>{setSel(null);setBody("");load();});};
  const shown=list.filter(m=>!q||(m.name+m.description+m.file).toLowerCase().includes(q.toLowerCase()));
  return <div className="grid lg:grid-cols-[20rem_1fr] gap-4">
    <div className="card p-3 h-[70vh] overflow-auto">
      <div className="flex gap-2 mb-2"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="filter…"
        className="flex-1 bg-slate-900 rounded px-2 py-1 text-sm"/>
        <button onClick={()=>{setSel(null);setBody("---\nname: \ndescription: \ntype: reference\n---\n\n## Summary\n");}}
          className="px-2 bg-emerald-700 rounded text-sm">+ new</button></div>
      {shown.map(m=><div key={m.file} onClick={()=>open(m.file)}
        className={"p-2 rounded cursor-pointer hover:bg-slate-800 "+(sel===m.file?"bg-slate-800":"")}>
        <div className="flex justify-between items-center"><span className="text-sm truncate">{m.name}</span>
          <Chip cls={TYPE_COLOR[m.type]}>{m.type}</Chip></div>
        <div className="text-xs text-slate-500 truncate">{m.description}</div></div>)}
      {!shown.length&&<div className="text-slate-600 text-sm p-2">no memories</div>}
    </div>
    <div className="card p-3 flex flex-col">
      <div className="flex gap-2 mb-2 items-center"><span className="text-sm text-slate-400">{sel||"new memory"}</span>
        <div className="ml-auto flex gap-2">{msg&&<span className="text-xs text-emerald-400">{msg}</span>}
        <button onClick={save} className="px-3 py-1 bg-sky-700 rounded text-sm">Save</button>
        {sel&&<button onClick={del} className="px-3 py-1 bg-rose-800 rounded text-sm">Delete</button>}</div></div>
      <textarea value={body} onChange={e=>setBody(e.target.value)}
        className="flex-1 bg-slate-900 rounded p-3 font-mono text-xs leading-relaxed h-[60vh]"/>
      <div className="text-xs text-slate-600 mt-1">Saves go through save_memory.sh (the same gated path as the CLI).</div>
    </div></div>;
}

function Graph(){
  const [q,setQ]=useState(""),[out,setOut]=useState(""),[ent,setEnt]=useState(""),[nb,setNb]=useState(null);
  const recall=()=>{setOut("…");fetch("/api/graph/recall?k=6&q="+encodeURIComponent(q)).then(r=>r.text()).then(setOut);};
  const neigh=()=>j("/api/graph/neighbors?entity="+encodeURIComponent(ent)).then(setNb).catch(e=>setNb({error:e.message}));
  return <div className="grid lg:grid-cols-2 gap-4">
    <div className="card p-4"><div className="text-sm mb-2">Recall — semantic + associative</div>
      <div className="flex gap-2"><input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&recall()}
        placeholder="what do I know about…" className="flex-1 bg-slate-900 rounded px-2 py-1 text-sm"/>
        <button onClick={recall} className="px-3 bg-sky-700 rounded text-sm">Recall</button></div>
      <pre className="whitespace-pre-wrap text-xs mt-3 text-slate-300">{out}</pre></div>
    <div className="card p-4"><div className="text-sm mb-2">Neighbors — what connects to an entity</div>
      <div className="flex gap-2"><input value={ent} onChange={e=>setEnt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&neigh()}
        placeholder="api-1, postgres, …" className="flex-1 bg-slate-900 rounded px-2 py-1 text-sm"/>
        <button onClick={neigh} className="px-3 bg-sky-700 rounded text-sm">Lookup</button></div>
      {nb&&nb.error&&<div className="text-rose-400 text-xs mt-2">{nb.error}</div>}
      {nb&&nb.edges&&<div className="mt-3 text-xs space-y-1">{nb.edges.map((e,i)=><div key={i}>
        <span className="text-emerald-400">[{e.rel}]</span> {e.other}: <span className="text-slate-400">{e.fact}</span></div>)}
        {!nb.edges.length&&<div className="text-slate-600">no edges</div>}</div>}</div></div>;
}

function Skills(){const [s,setS]=useState(null);useEffect(()=>{j("/api/skills").then(setS);},[]);
  if(!s)return <div className="text-slate-500">loading…</div>;
  return <div className="grid gap-4 lg:grid-cols-2"><div className="card p-4"><div className="text-sm mb-2">Installed skills ({s.installed.length})</div>
    <div className="space-y-2">{s.installed.map(k=><div key={k.name}><div className="text-sm text-sky-300">/{k.name}</div>
      <div className="text-xs text-slate-500">{k.description}</div></div>)}</div></div>
    <div className="card p-4"><div className="text-sm mb-2">Pending auto-install ({s.pending.length})</div>
      {s.pending.length?s.pending.map(p=><div key={p} className="text-xs text-amber-300">{p}</div>):<div className="text-slate-600 text-xs">none — clean</div>}</div></div>;
}

function Queues(){const [qd,setQd]=useState(null);useEffect(()=>{j("/api/queues").then(setQd);},[]);
  if(!qd)return <div className="text-slate-500">loading…</div>;
  const col=(t,a)=><div className="card p-4"><div className="text-sm mb-2">{t} ({a.length})</div>
    {a.length?a.map(x=><div key={x} className="text-xs text-slate-400">{x}</div>):<div className="text-slate-600 text-xs">empty</div>}</div>;
  return <div className="grid lg:grid-cols-2 gap-4">{col("Staging (short-term)",qd.staging)}{col("Quarantine (suspect)",qd.quarantine)}</div>;
}

function App(){
  const [tab,setTab]=useState("Dashboard");
  const tabs={Dashboard:<Dashboard/>,Memories:<Memories/>,Graph:<Graph/>,Skills:<Skills/>,Queues:<Queues/>};
  return <div className="max-w-6xl mx-auto p-5">
    <div className="flex items-center gap-3 mb-5">
      <span className="text-2xl">🧠</span><span className="text-xl font-semibold">engram</span>
      <span className="text-xs text-slate-500">neuro-inspired memory for Claude Code · local-only</span></div>
    <div className="flex gap-1 mb-5 border-b border-slate-800">
      {Object.keys(tabs).map(t=><button key={t} onClick={()=>setTab(t)}
        className={"px-4 py-2 text-sm "+(tab===t?"border-b-2 border-sky-400 text-sky-300":"text-slate-400")}>{t}</button>)}</div>
    {tabs[tab]}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
